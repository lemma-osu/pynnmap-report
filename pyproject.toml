[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynnmap-report"
dynamic = ["version"]
description = "Report generation for pynnmap accuracy assessment"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Matt Gregory", email = "matt.gregory@oregonstate.edu" }]
dependencies = [
    "click",
    "matplotlib",
    "numpy",
    "pandas",
    "pynnmap",
    "pyyaml",
    "reportlab",
    "scipy",
]

[project.entry-points.pynnmap]
report = "pynnmap_report.cli.report:main"

[project.urls]
Homepage = "https://github.com/lemma-osu/pynnmap-report"
Source = "https://github.com/lemma-osu/pynnmap-report"

[tool.hatch.version]
path = "src/pynnmap_report/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pynnmap_report"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.envs.default]
dependencies = [
    "pre-commit",
    "pynnmap @ file://{root}/../pynnmap",
]

[tool.hatch.envs.test]
dependencies = ["pytest", "pytest-cov"]

[tool.hatch.envs.test.scripts]
all = "pytest . {args} --doctest-modules"
coverage = "pytest . --cov=src/pynnmap_report {args} --doctest-modules"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = "src/"
testpaths = ["tests/"]

[tool.ruff]
target-version = "py39"
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E",
    "I",
    "F",
    "B",
    "FA",
    "UP",
    "ISC",
    "PT",
    "NPY",
    "Q",
    "RET",
    "SIM",
    "PERF",
]

[tool.ruff.lint.isort]
known-first-party = ["pynnmap_report"]
